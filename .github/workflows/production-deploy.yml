name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency only)"
        required: false
        default: "false"
        type: boolean

env:
  NODE_VERSION: "18"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  pre-deployment-checks:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Security audit
        run: npm audit --audit-level high

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks]
    if: ${{ always() && (needs.pre-deployment-checks.result == 'success' || inputs.skip_tests) }}

    environment:
      name: production
      url: https://examprep-platform.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i --global vercel@canary

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Production deployment URL: $url"

  post-deployment-tests:
    name: Post-deployment Validation
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: ${{ always() && needs.deploy-production.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Production Smoke Tests
        run: |
          echo "Running production smoke tests..."

          # Basic connectivity test
          echo "Testing basic connectivity..."
          curl -f "https://examprep-platform.vercel.app" || exit 1

          # API health checks
          echo "Testing API endpoints..."
          curl -f "https://examprep-platform.vercel.app/api/health" || echo "Health endpoint not available"

          # Performance check - should load within 2 seconds
          echo "Testing performance requirements..."
          response_time=$(curl -o /dev/null -s -w '%{time_total}\n' "https://examprep-platform.vercel.app")
          if (( $(echo "$response_time > 2.0" | bc -l) )); then
            echo "WARNING: Page load time ($response_time s) exceeds 2s requirement"
            exit 1
          fi
          echo "Performance check passed: ${response_time}s"

      - name: Database Migration Validation
        run: |
          echo "Validating database schema is current..."
          # This will be implemented when Supabase MCP is integrated
          echo "Database validation placeholder - implement with Supabase MCP"

      - name: Security Headers Check
        run: |
          echo "Validating security headers..."
          curl -I "https://examprep-platform.vercel.app" | grep -i "strict-transport-security" || echo "HSTS header missing"
          curl -I "https://examprep-platform.vercel.app" | grep -i "x-frame-options" || echo "X-Frame-Options header missing"

  rollback-on-failure:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    needs: [post-deployment-tests]
    if: ${{ always() && needs.post-deployment-tests.result == 'failure' }}

    steps:
      - name: Checkout previous version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i --global vercel@canary

      - name: Emergency Rollback
        run: |
          echo "🚨 EMERGENCY ROLLBACK: Post-deployment tests failed"
          vercel rollback --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Notify team of rollback
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Deployment Rolled Back',
              body: 'Production deployment was automatically rolled back due to failed post-deployment tests. Please investigate immediately.',
              labels: ['critical', 'production', 'rollback']
            })

name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate --json > audit-results.json || true

      - name: Parse audit results
        run: |
          if [ -f audit-results.json ]; then
            vulnerabilities=$(cat audit-results.json | jq '.metadata.vulnerabilities | to_entries | map(select(.value > 0)) | length')
            if [ "$vulnerabilities" -gt 0 ]; then
              echo "::warning::Found $vulnerabilities vulnerability types"
              cat audit-results.json | jq '.vulnerabilities'
            else
              echo "No vulnerabilities found in dependencies"
            fi
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run secret detection
        run: |
          echo "Scanning for secrets..."
          detect-secrets scan --all-files --baseline .secrets.baseline

      - name: Verify baseline
        run: |
          echo "Verifying secrets baseline..."
          detect-secrets audit --baseline .secrets.baseline --report --fail-on-unaudited-secrets

      - name: Check for new secrets
        run: |
          echo "Checking for new secrets since baseline..."
          detect-secrets scan --all-files > current-secrets.json
          if ! detect-secrets audit --baseline current-secrets.json --report; then
            echo "::error::New secrets detected! Please review and update baseline if appropriate."
            exit 1
          fi

  code-security-scan:
    name: Code Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security rules
        run: |
          echo "Running ESLint with security focus..."
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-security.json || true

      - name: Check for security patterns
        run: |
          echo "Checking for common security anti-patterns..."

          # Check for hardcoded secrets
          echo "Checking for hardcoded API keys..."
          if grep -r "sk_live\|pk_live\|rk_live" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" . ; then
            echo "::error::Hardcoded Stripe live keys detected!"
            exit 1
          fi

          # Check for console.log in production code
          echo "Checking for debug statements..."
          if grep -r "console\.log\|debugger" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" app/ lib/ components/ ; then
            echo "::warning::Debug statements found in source code"
          fi

          # Check for unsafe eval usage
          echo "Checking for unsafe eval usage..."
          if grep -r "eval(" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" . ; then
            echo "::error::Unsafe eval() usage detected!"
            exit 1
          fi

          # Check for SQL injection patterns
          echo "Checking for potential SQL injection patterns..."
          if grep -r "query.*+.*req\." --include="*.js" --include="*.ts" . ; then
            echo "::warning::Potential SQL injection pattern detected"
          fi

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            eslint-security.json
          retention-days: 30

  docker-security-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: false # Disabled until Docker is implemented

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t examprep:security-scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "examprep:security-scan"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  environment-security-check:
    name: Environment Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate environment files
        run: |
          echo "Validating environment configuration..."

          # Check .env.example doesn't contain real secrets
          if [ -f ".env.example" ]; then
            echo "Checking .env.example for real secrets..."
            if grep -E "(sk_live|pk_live|rk_live|prod)" .env.example; then
              echo "::error::Production secrets found in .env.example!"
              exit 1
            fi
            
            # Check for proper placeholder format
            if ! grep -E "your_|example_|<.*>" .env.example; then
              echo "::warning::.env.example should use proper placeholder format (your_*, example_*, <value>)"
            fi
          fi

          # Check .gitignore covers sensitive files
          echo "Validating .gitignore coverage..."
          if ! grep -q "\.env\.local" .gitignore; then
            echo "::error::.env.local not in .gitignore!"
            exit 1
          fi

          if ! grep -q "\.env\.production" .gitignore; then
            echo "::warning::.env.production should be in .gitignore"
          fi

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check package-lock.json integrity
        run: |
          echo "Checking package-lock.json integrity..."
          npm ci --dry-run

      - name: Validate package sources
        run: |
          echo "Validating package registry sources..."

          # Check for non-npm registry packages
          if npm list --depth=0 --json | jq -r '.dependencies | to_entries[] | select(.value.resolved | startswith("https://registry.npmjs.org") | not) | .key' | grep -v "^$"; then
            echo "::warning::Packages from non-npm registries detected"
          fi

      - name: Check for known malicious packages
        run: |
          echo "Checking against known malicious package patterns..."

          # This is a basic check - in production, integrate with security databases
          suspicious_patterns=("crypto-mining" "bitcoin" "monero" "keylogger")

          for pattern in "${suspicious_patterns[@]}"; do
            if npm list --depth=999 | grep -i "$pattern"; then
              echo "::warning::Suspicious package pattern detected: $pattern"
            fi
          done

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs:
      [
        dependency-scan,
        secret-scan,
        code-security-scan,
        environment-security-check,
        supply-chain-security,
      ]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" > security-report.md
          echo "Generated: $(date)" >> security-report.md
          echo "" >> security-report.md

          echo "## Scan Results" >> security-report.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
          echo "- Secret Detection: ${{ needs.secret-scan.result }}" >> security-report.md
          echo "- Code Security: ${{ needs.code-security-scan.result }}" >> security-report.md
          echo "- Environment Check: ${{ needs.environment-security-check.result }}" >> security-report.md
          echo "- Supply Chain: ${{ needs.supply-chain-security.result }}" >> security-report.md
          echo "" >> security-report.md

          if [ -f npm-audit-results/audit-results.json ]; then
            echo "## Dependency Vulnerabilities" >> security-report.md
            jq -r '.vulnerabilities | to_entries[] | "- \(.key): \(.value)"' npm-audit-results/audit-results.json >> security-report.md || true
          fi

          cat security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 90

      - name: Create security issue on failure
        if: |
          needs.dependency-scan.result == 'failure' || 
          needs.secret-scan.result == 'failure' || 
          needs.code-security-scan.result == 'failure' ||
          needs.environment-security-check.result == 'failure' ||
          needs.supply-chain-security.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '🚨 **Security Scan Failures Detected**\n\n';

            if (fs.existsSync('security-report.md')) {
              body += fs.readFileSync('security-report.md', 'utf8');
            }

            body += '\n\n**Action Required:** Please review and address the security issues identified above.';

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Scan Failures - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['security', 'critical']
            });
